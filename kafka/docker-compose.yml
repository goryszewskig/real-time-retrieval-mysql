services:

  # CDC source: MySQL 8.0 with row-based binlog enabled (required by
  # the Debezium MySQL connector).
  mysql-source:
    image: mysql:8.0
    container_name: cdc-mysql-source
    hostname: mysql-source

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog_format=ROW
      - --binlog_row_image=FULL
      - --gtid_mode=ON
      - --enforce_gtid_consistency=ON

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql-source-data:/var/lib/mysql
      # *.sql here runs once, on first container initialisation.
      - ./mysql/source-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - cdc


  # CDC destination: MySQL 8.0 with a FULLTEXT index on the users
  # table (the replacement for OpenSearch + Qdrant).
  mysql-dest:
    image: mysql:8.0
    container_name: cdc-mysql-dest
    hostname: mysql-dest

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3307:3306"

    volumes:
      - mysql-dest-data:/var/lib/mysql
      - ./mysql/dest-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - cdc


  kafka:
    image: apache/kafka:4.0.0
    container_name: cdc-kafka
    hostname: kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      # KRaft - single node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # PLAINTEXT is for other containers on the "cdc" network (e.g.
      # debezium), which resolve "kafka" via Docker's internal DNS.
      # EXTERNAL is for clients running on the host machine (e.g.
      # consumer/index_users.py via the venv), which can't resolve
      # "kafka" and need "localhost" instead.
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node development settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - cdc


  debezium:
    image: quay.io/debezium/connect:3.3
    container_name: cdc-debezium
    hostname: debezium

    depends_on:
      kafka:
        condition: service_started
      # The connector can't even start capturing until the source
      # MySQL is accepting connections and its binlog exists.
      mysql-source:
        condition: service_healthy

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      # Kafka Connect worker
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      # JSON for easy inspection while learning
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # REST API
      REST_PORT: 8083
      REST_ADVERTISED_HOST_NAME: debezium

    networks:
      - cdc


volumes:
  kafka-data:
  mysql-source-data:
  mysql-dest-data:

networks:
  cdc:
    driver: bridge