services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      # KRaft - single node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # PLAINTEXT is for other containers on the "cdc" network (e.g.
      # debezium), which resolve "kafka" via Docker's internal DNS.
      # EXTERNAL is for clients running on the host machine (e.g.
      # consumer/index_users.py via the venv), which can't resolve
      # "kafka" and need "localhost" instead.
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node development settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - cdc


  debezium:
    image: quay.io/debezium/connect:3.3
    container_name: debezium
    hostname: debezium

    depends_on:
      - kafka

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      # Kafka Connect worker
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      # JSON for easy inspection while learning
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # REST API
      REST_PORT: 8083
      REST_ADVERTISED_HOST_NAME: debezium

    networks:
      - cdc


volumes:
  kafka-data:

networks:
  cdc:
    driver: bridge